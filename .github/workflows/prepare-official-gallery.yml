name: Prepare Official Gallery Assets

on:
  push:
    branches:
      - feature/official-style-gallery-20261120
    paths:
      - scripts/export-official-gallery.py
      - .github/workflows/prepare-official-gallery.yml

permissions:
  contents: write

jobs:
  export-official-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF image tools
        run: python -m pip install 'pymupdf>=1.24,<1.28' 'Pillow>=10,<13'
      - name: Extract approved model photos from official Korea brochures
        run: python scripts/export-official-gallery.py
      - name: Commit extracted local WebP photos to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/official-gallery/*.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets: self-host correct 27MY vehicle images from official Korea catalogues'
            git push origin HEAD:feature/official-style-gallery-20261120
          fi
