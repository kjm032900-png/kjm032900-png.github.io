name: Latest colour guide UI audit (non-production)
on:
  push:
    branches: ['audit/latest-colour-ui-20261120']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  colours:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tests/colour-ux-audit.mjs
