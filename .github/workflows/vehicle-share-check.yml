name: Vehicle Share QA
on:
  push:
    branches:
      - feature/vehicle-share-crm-20261120
  pull_request:
    paths:
      - 'index.html'
      - 'share.html'
      - 'vehicle-share*.js'
      - 'vehicle-share.css'
      - 'content.json'
      - 'vehicle-ids.json'
      - 'catalog-links.json'
      - 'tests/vehicle-share.e2e.mjs'
      - 'scripts/verify-vehicle-share.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-and-galaxy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check vehicle registry, catalogues and original data integrity
        run: node scripts/verify-vehicle-share.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser test desktop and mobile
        run: node tests/vehicle-share.e2e.mjs
