name: Catalogue colour guide checks
on:
  pull_request:
    paths:
      - 'catalog-colors.json'
      - 'colors.js'
      - 'eclass-sprites.js'
      - 'catalog-photo-atlases/**'
      - 'scripts/verify-photo-atlases.mjs'
      - 'colors.html'
      - 'colors.css'
      - 'content.json'
      - 'index.html'
      - 'scripts/verify-catalog-colors.mjs'
      - 'scripts/catalog_crop.py'
      - '.github/workflows/catalog-color-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover public Shorts metadata for gallery
        run: |
          python3 -m pip install --user yt-dlp --quiet
          echo "=== SHORTS LIST START ==="
          ~/.local/bin/yt-dlp --ignore-errors --flat-playlist --playlist-end 18 --print '%(id)s|%(title)s' https://www.youtube.com/@movenzz/shorts || true
          echo "=== SHORTS LIST END ==="
          for id in VdWMJMJkFaQ nOIVVeJiwIQ Zt-IzDLAivU; do
            echo "portrait-thumb:${id} $(curl -L -s --max-time 8 -o /dev/null -w '%{http_code} %{size_download}' https://i.ytimg.com/vi/${id}/oar2.jpg)"
            echo "fallback-thumb:${id} $(curl -L -s --max-time 8 -o /dev/null -w '%{http_code} %{size_download}' https://i.ytimg.com/vi/${id}/hqdefault.jpg)"
          done
      - name: Verify JavaScript syntax
        run: |
          node --check colors.js
          node --check eclass-sprites.js
          node --check scripts/verify-photo-atlases.mjs
          for file in catalog-photo-atlases/*.js; do node --check "$file"; done
          node --check scripts/verify-catalog-colors.mjs
      - name: Verify PDF crop helper Python syntax
        run: python -m py_compile scripts/catalog_crop.py
      - name: Check original PDF photo atlases, page references and WebP payloads
        run: node scripts/verify-photo-atlases.mjs
      - name: Verify catalogue grouping, provenance and approved assets
        run: node scripts/verify-catalog-colors.mjs
