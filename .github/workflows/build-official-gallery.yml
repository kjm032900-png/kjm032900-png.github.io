name: Build approved model gallery assets
on:
  push:
    branches:
      - feature/official-style-gallery-price-261117
    paths:
      - scripts/export-official-gallery.py
      - .github/workflows/build-official-gallery.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/official-style-gallery-price-261117
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image and PDF tools
        run: python -m pip install --disable-pip-version-check "pymupdf>=1.24,<1.28" "pillow>=10,<13"
      - name: Extract four images from official PDF brochures
        run: python scripts/export-official-gallery.py
      - name: Commit images to staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/official-gallery/
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "assets: add verified model gallery cutouts"
            git push origin HEAD:feature/official-style-gallery-price-261117
          fi
