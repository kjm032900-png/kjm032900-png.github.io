/* Approach-book → existing catalogue colour guide: new-tab links preserve current page. */
.color-guide-bridge{background:linear-gradient(135deg,#122333 0%,#213a4d 100%);border:1px solid #7798ae;border-radius:15px;padding:21px 22px 18px;margin:18px 0 20px;color:#f3f8fc;box-shadow:0 8px 24px #10273a18}
.color-guide-top{display:flex;justify-content:space-between;align-items:start;gap:14px;margin-bottom:17px}
.color-guide-eyebrow{font-size:10px;font-weight:850;color:#a8d6ef;letter-spacing:.19em;margin:0 0 6px}
.color-guide-top h2{margin:0 0 7px;font-size:21px;line-height:1.35;letter-spacing:-.03em}
.color-guide-top p:not(.color-guide-eyebrow){margin:0;font-size:12px;line-height:1.6;color:#c8d9e5}
.color-guide-link-label{white-space:nowrap;font-size:11px;letter-spacing:.03em;color:#c8deec;background:#ffffff15;border:1px solid #ffffff38;padding:8px 10px;border-radius:99px}
.color-guide-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.color-action{display:flex;align-items:center;gap:10px;min-height:78px;padding:13px 12px;border-radius:11px;text-decoration:none;background:#eff5f9;color:#142e43;border:1px solid #eaf4fa;transition:transform .15s ease,background .15s ease}
.color-action:hover{background:#fff;transform:translateY(-2px)}
.color-action:focus-visible{outline:3px solid #b0e6ff;outline-offset:3px}
.color-action-seats{background:#dcebf5;border-color:#c7dfec}
.color-icon{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:11px;background:#17364d;color:#fff;font-size:20px}
.color-action-content{display:flex;flex-direction:column;gap:3px;min-width:0}
.color-action-content strong{font-size:15px;line-height:1.35}
.color-action-content small{color:#4a687d;font-size:11px;line-height:1.45}
.color-action-arrow{margin-left:auto;color:#1a485f;font-size:17px;font-weight:850}
.color-guide-hint{font-size:11px;line-height:1.75;color:#c0d3e1;margin:12px 0 0}
.color-guide-hint strong{color:#fff;font-weight:800}
.color-guide-family-hint{background:#e7f1f6;border:1px solid #c2d9e7;border-radius:9px;padding:12px 16px;color:#284f68;font-size:13px;line-height:1.6;margin-bottom:17px}
@media(max-width:540px){.color-guide-bridge{margin:13px 0 16px;padding:16px 13px 14px}.color-guide-top{display:block}.color-guide-top h2{font-size:18px}.color-guide-link-label{display:none}.color-guide-actions{gap:8px}.color-action{min-height:86px;padding:12px 9px;gap:6px;flex-direction:column;text-align:center;justify-content:center}.color-action-content strong{font-size:13px}.color-action-content small{font-size:10px}.color-icon{width:30px;height:30px;font-size:17px}.color-action-arrow{display:none}.color-guide-hint{font-size:11px}}
@media(prefers-reduced-motion:reduce){.color-action{transition:none}.color-action:hover{transform:none}}
@media print{.color-guide-bridge,.color-guide-family-hint{display:none!important}}

/* Development-only traceability: visually distinct source-derived/unverified sections */
.review-strip{display:flex;align-items:center;flex-wrap:wrap;gap:7px 12px;padding:12px 14px;margin:12px 0 16px;background:#fff8ed;border:1px solid #e6c99b;border-radius:9px;color:#5c4630;font-size:12px;line-height:1.5}
.review-strip strong{font-weight:800}
.review-dot{width:7px;height:7px;background:#a76515;border-radius:100%}
.review-source{margin-left:auto;border:1px solid #b58a4f;border-radius:6px;background:#fff;color:#5c4630;cursor:pointer;padding:7px 11px;font-size:12px;font-weight:800;min-height:36px}
.source-spec-list{border:1px solid #dae4e9;border-radius:9px;overflow:hidden}
.source-spec-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px 15px;padding:10px 12px;border-bottom:1px solid #e3ebef;align-items:center;line-height:1.55;font-size:13px}
.source-spec-row:last-child{border-bottom:0}
.source-spec-row:nth-child(2n){background:#f5f8fa}
.source-spec-fragment{white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:420px){.review-source{margin-left:0}.source-spec-row{grid-template-columns:repeat(auto-fit,minmax(95px,1fr));padding:10px 8px;font-size:12px}}

.price-alert{background:#fff4e4;color:#5d300f;border-top:1px solid #d8b580;border-bottom:1px solid #d8b580;padding:14px 18px;font-size:13px;line-height:1.65}
.price-alert>strong{display:block;font-size:14px;color:#772600}
.price-alert p{margin:3px 0 10px}
.price-alert-item{padding:9px 0;display:flex;flex-wrap:wrap;gap:5px 15px;border-top:1px solid #e1cbb1}
.price-alert-item b{width:100%}
.price-alert-item span{font-variant-numeric:tabular-nums}
.price-alert-item small{width:100%;color:#744725}

/* Integrated approach-book reader */
.nav-home[type=button]{font-family:inherit;font-size:13px;font-weight:700;color:inherit;background:transparent;cursor:pointer}.nav-home[type=button]:disabled{opacity:.5;cursor:default}
.family-reader-banner{display:grid;gap:12px;grid-template-columns:minmax(0,1fr) auto;align-items:center}
.family-book-action{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;font-size:14px;min-height:56px;border-color:#193d56}
.family-book-action small{font-size:11px;font-weight:500;color:#d1e6f4}
.family-back-link{grid-column:1/-1;justify-self:start}
.reader-toolbar{background:#fff;border:1px solid #cadbe6;border-radius:12px;padding:14px;margin:16px 0}
.book-reader-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.book-reader-actions label{font-weight:800;font-size:13px;color:#32536b}
.book-reader-actions select{padding:11px;border:1px solid #8ba1b2;border-radius:8px;min-height:44px;background:#fff;color:#193348;font:inherit;flex:1;min-width:190px;max-width:420px}
.book-sheet{background:#fff;border:1px solid #d1dfe7;border-radius:13px;padding:16px;margin:0 0 18px;overflow:hidden}
.book-sheet>a{display:block;text-align:center}
.book-sheet img{display:block;width:100%;height:auto;max-width:1100px;margin:0 auto;border:1px solid #d7e0e6}
.book-sheet-heading{display:flex;align-items:center;flex-wrap:wrap;gap:9px 15px;margin:0 0 14px}
.book-sheet-heading h2{font-size:17px;line-height:1.5;flex:1;min-width:150px;margin:0}
.book-sheet-heading a{font-size:13px;font-weight:800;color:#155e8b}

  <script>/* Mobile-first digital approach book; source-preserving display. */
(()=>{
  'use strict';
  const DATA=window.APPROACH_DATA;
  const $=id=>document.getElementById(id);
  const ESC_MAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>ESC_MAP[c]);
  const normalize=v=>String(v||'').normalize('NFKC').toLowerCase().replace(/[\s\u2010-\u2015-]+/g,'');
  const state={query:'',cat:'전체',year:'전체',tab:'specs',diff:false,prevScroll:0};
  const families=Array.isArray(DATA?.families)?DATA.families:[];
  const pages=Array.isArray(DATA?.pages)?DATA.pages:[];
  const pageById=new Map(pages.map(p=>[p.id,p]));
  const familyByName=new Map(families.map(f=>[f.name,f]));
  const categories=['전체',...new Set(families.map(f=>f.category))];
  let currentView=''; let currentKey='';
  const savedScrolls=new Map();
  const originForPage=new Map();
  let currentRouteKey=location.hash||'#home';


  function route(){
    const qs=new URLSearchParams(location.hash.replace(/^#/,''));
    const id=qs.get('page');if(id&&pageById.has(id))return{kind:'page',key:id};
    const book=qs.get('book');if(book&&familyByName.has(book))return{kind:'book',key:book,item:qs.get('item'),mode:qs.get('mode')==='scroll'?'scroll':'pages'};
    const family=qs.get('family');if(family&&familyByName.has(family))return{kind:'family',key:family};
    return{kind:'home',key:''};
  }
  const pageLink=id=>'#page='+encodeURIComponent(id);
  const familyLink=name=>'#family='+encodeURIComponent(name);
  const bookLink=(name,item='',mode='pages')=>'#book='+encodeURIComponent(name)+(item?'&item='+encodeURIComponent(item):'')+(mode==='scroll'?'&mode=scroll':'');
  function pageYearLabel(p){return p.year==='연식 미상'?'원본 연식 확인':p.year}
  function numericYear(p){const m=String(p.year).match(/MY(\d\d)/);return m?'20'+m[1]+'년식':'연식 확인 필요'}
  function toast(message){const t=$('toast');t.textContent=message;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{t.hidden=true},3400)}
  function renderChrome(){
    $('backButton').disabled=route().kind==='home';
  }
  function backToPrevious(){
    const r=route();if(r.kind==='home')return;
    if(r.kind==='page')location.hash=originForPage.get(r.key)||familyLink(pageById.get(r.key).family);
    else if(r.kind==='book')location.hash=familyLink(r.key);
    else location.hash='#';
  }
  function heroStats(){return `<div class="stats"><div class="stat"><b>${families.length}</b><span>모델 분류</span></div><div class="stat"><b>${pages.length}</b><span>차량별 자료 페이지</span></div><div class="stat"><b>${DATA.info.sourcePages}</b><span>원본 PDF 전체 페이지</span></div></div>`;}
  function homeMarkup(){
    return `<section class="hero"><div class="frame"><p class="eyebrow">MERCEDES-BENZ · DIGITAL APPROACH BOOK</p><h1>전 차종 어프로치북</h1><p class="hero-desc">원본 어프로치북의 차량 제원, 트림별 옵션, 연식별 내용을 PC와 갤럭시에서 읽기 편하게 정리했습니다. 필요한 차량의 자료만 선택해서 확인하세요.</p>${heroStats()}</div></section>

        html+=items.length>1?`<div class="option-row"><div class="option-compare" style="--cols:${Math.min(items.length,3)}">${items.map(i=>`<div class="option-entry">${esc(i)}</div>`).join('')}</div></div>`:`<div class="raw-line">${esc(items[0])}</div>`;
      }
      if(!lineItems.length)html+='<p>옵션 원본 텍스트를 자동 추출하지 못했습니다. 원본 페이지를 확인해 주세요.</p>';
      return html+'</section>';
    }
    let sectionCount=0;
    let html=`<section class="content-panel">${sourceStatus(p,'options')}<div class="option-controls"><div><h2>트림별 옵션 비교</h2><p class="panel-hint" style="margin:5px 0">PDF 원본의 트림별 열 구성을 보존했습니다. 빈 칸은 ‘미적용’을 의미하지 않을 수 있습니다.</p></div>${p.variants.length>1?`<label class="switch"><input type="checkbox" id="differenceOnly" ${state.diff?'checked':''}>다른 내용만 보기 (참고)</label>`:''}</div>`;
    for(const sec of p.options){
      const show=sec.rows.filter(cells=>{
        if(!state.diff)return true;
        const nonempty=cells.filter(Boolean);
        return nonempty.length>=2 && new Set(nonempty).size>1;
      });
      if(!show.length)continue;
      sectionCount++;
      html+=`<div class="option-section"><h3>${esc(sec.name)}</h3><div class="option-rows">`;
      for(const cells of show){
        const nonempty=cells.filter(Boolean);
        const isCommon=nonempty.length===1;
        html+=`<div class="option-row ${isCommon?'common':''}">${isCommon?`<div class="option-entry">${esc(nonempty[0])}</div>`:`<div class="option-compare" style="--cols:${Math.min(3,cells.length)}">${cells.map(c=>`<div class="option-entry">${esc(c)}</div>`).join('')}</div>`}</div>`;
      }
      html+='</div></div>';
    }
    if(!sectionCount)html+='<p class="panel-hint">차이가 표시된 행이 없습니다. 전체 옵션으로 다시 전환해 주세요.</p>';
    return html+'</section>';
  }
  function originalMarkup(p){return `<section id="sourcePanel" class="content-panel"><h2>${esc(p.family)} 어프로치북 · 원본 ${p.page}페이지</h2><p class="panel-hint">원본 내용을 가볍게 변환한 이미지입니다. 확대가 필요한 경우 ‘원본 이미지 열기’를 사용하세요. 원본 PDF 전체를 매번 내려받지 않습니다.</p><div class="source-action"><a href="${esc(p.preview)}" target="_blank" rel="noopener" class="btn btn-primary">${esc(p.family)} 어프로치북 크게 보기 ↗</a><button type="button" class="btn" id="printPage">현재 자료 인쇄</button></div><img class="source-image" src="${esc(p.preview)}" alt="원본 어프로치북 ${p.page}쪽 전체 페이지" loading="lazy" decoding="async"></section>`;}
  function sideMarkup(p){return `<aside class="info-sidebar"><div class="side-card"><h3>원본 자료 위치</h3><span class="page-source-number">${p.page}<small style="font-size:14px"> / ${DATA.info.sourcePages}쪽</small></span><p>${esc(p.title)}<br>원본과 항목별 대조가 가능합니다.</p><a class="btn" href="#sourcePanel" data-scroll-source>${esc(p.family)} 어프로치북</a></div><div class="side-card"><h3>빠른 이동</h3><a href="${familyLink(p.family)}" class="btn" data-back>← 뒤로가기</a><a href="#" class="btn">← 전체 차종 목록</a><button type="button" class="btn" id="copyLink">현재 페이지 주소 복사</button></div><div class="side-card"><h3>검토 유의사항</h3><p>제원과 옵션은 원본에 수록된 자료입니다. 실제 차량의 옵션·가격·재고와 상이할 수 있으므로 계약 전 재검증이 필요합니다.</p>${p.notes.length?`<ul class="side-list">${p.notes.map(n=>`<li>${esc(n)} 원문 있음</li>`).join('')}</ul>`:''}</div></aside>`;}
  function pageMarkup(p){
    return `<section class="detail">${breadcrumbs(p)}<div class="detail-layout"><div class="detail-main">${summaryMarkup(p)}${colorGuideMarkup(p)}<div id="detailPanel">${originalMarkup(p)}</div><div class="source-action"><a class="btn" href="${familyLink(p.family)}" data-back>← 뒤로가기</a><button class="btn" id="copyLinkBottom">링크 복사</button></div></div>${sideMarkup(p)}</div></section>`;
  }
  function render(opts={}){
    const r=route();const changed=r.kind!==currentView||r.key!==currentKey;
    if(changed){state.tab='source';state.diff=false}
    currentView=r.kind;currentKey=r.key;
    const app=$('app');
    if(!DATA||pages.length!==DATA.info.vehiclePages){app.innerHTML='<div class="error">어프로치북 데이터를 읽지 못했습니다. 파일 구성을 확인해 주세요.</div>';return}
    if(r.kind==='home'){app.innerHTML=homeMarkup();renderFamilyGrid()}
    else if(r.kind==='family')app.innerHTML=familyMarkup(familyByName.get(r.key));
    else if(r.kind==='book')app.innerHTML=familyBookMarkup(familyByName.get(r.key),r);
    else app.innerHTML=pageMarkup(pageById.get(r.key));
    renderChrome();
    if(changed&&!opts.keepScroll)window.scrollTo({top:0,behavior:'instant'});
  }
  document.addEventListener('input',e=>{
    if(e.target.id==='modelSearch'){state.query=e.target.value;renderFamilyGrid()}
  });
  document.addEventListener('change',e=>{
    if(e.target.id==='yearSelect'){state.year=e.target.value;renderFamilyGrid()}
    if(e.target.id==='differenceOnly'){state.diff=e.target.checked;const prev=window.scrollY;render({keepScroll:true});window.scrollTo(0,prev)}
    if(e.target.id==='bookJump'){const r=route();if(r.kind==='book'){
      if(r.mode==='scroll')document.getElementById('source-'+e.target.value)?.scrollIntoView({behavior:'smooth',block:'start'});
      else location.hash=bookLink(r.key,e.target.value);
    }}
  });
  document.addEventListener('click',async e=>{
    if(e.target.closest('[data-scroll-source]')){e.preventDefault();document.getElementById('sourcePanel')?.scrollIntoView({behavior:'smooth',block:'start'});return}
    if(e.target.closest('#backButton')||e.target.closest('[data-back]')){e.preventDefault();backToPrevious();return}
    const chip=e.target.closest('[data-cat]');
    if(chip){state.cat=chip.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.setAttribute('aria-pressed',String(x===chip)));renderFamilyGrid();return}
    if(e.target.closest('#resetSearch')){state.cat='전체';state.year='전체';state.query='';render();return}
    const tab=e.target.closest('[data-tab]');
    if(tab){state.tab=tab.dataset.tab;const previous=window.scrollY;render({keepScroll:true});window.scrollTo(0,previous);return}
    if(e.target.closest('#printPage')){window.print();return}
    if(e.target.closest('#copyLink')||e.target.closest('#copyLinkBottom')){
      if(location.protocol!=='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'){toast('이 링크는 홈페이지에서 열었을 때 복사할 수 있습니다.');return}
      const url=location.href;
      try{await navigator.clipboard.writeText(url);toast('현재 차량 상세 링크를 복사했습니다.')}catch(_){toast('복사할 수 없습니다. 주소창에서 URL을 복사해 주세요.')}return;
    }
  });
  window.addEventListener('hashchange',()=>{
    const next=location.hash||'#home';
    render({keepScroll:true});
    requestAnimationFrame(()=>window.scrollTo(0,savedScrolls.get(next)||0));
    currentRouteKey=next;
  });
  document.addEventListener('click',event=>{
    const anchor=event.target.closest('a[href^="#"]');
    if(anchor&&anchor.getAttribute('href')!=='#main'){
      savedScrolls.set(currentRouteKey,window.scrollY);
      const destination=new URLSearchParams(anchor.getAttribute('href').replace(/^#/,''));
      const destPage=destination.get('page');if(destPage&&pageById.has(destPage))originForPage.set(destPage,currentRouteKey);
    }
  },true);
  window.addEventListener('pageshow',event=>{if(event.persisted)render({keepScroll:true})});
  render();
})();
</script>
</body>
</html>
